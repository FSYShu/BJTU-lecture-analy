[project]
name = "bjtu-lecture-analy-backend"
version = "0.1.0"
description = "交大课录智析后端 - 北京交通大学课程回放AI解析平台"
requires-python = ">=3.11,<3.15"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "passlib[bcrypt]>=1.7,<2",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.27,<0.28",
    "ffmpeg-python>=0.2,<0.3",
    "loguru>=0.7,<0.8",
    "python-multipart>=0.0.9",
    "tenacity>=8.2,<9",
    "playwright>=1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5,<6",
    "respx>=0.21,<0.22",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
